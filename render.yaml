# Render Blueprint — https://render.com/docs/blueprint-spec
# One-click deploy via https://render.com/deploy?repo=<this-repo>
#
# Free Web Service: HTTPS auto-provisioned, no card required, no quota.
# Downside: free tier spins down after 15 min of inactivity. First request
# after a nap wakes it in ~30 s; subsequent requests are instant. Fine for
# ad-hoc iPhone / Desktop testing.
services:
  - type: web
    name: fitness-mcp
    runtime: docker        # Dockerfile at repo root owns the build.
    plan: free
    region: oregon          # us-west; change if you prefer another region.

    # Render pings this to decide the service is up. Must be public (we
    # expose /healthz with no auth on purpose).
    healthCheckPath: /healthz

    # No secrets needed — multi-tenant HTTP mode gets each user's Garmin
    # key from the per-request Authorization header.
    envVars:
      - key: FITNESS_MCP_LOG_LEVEL
        value: INFO

      # Render's hostname isn't fixed per-build; we can't precompute an
      # allowed_hosts list. Flag the SDK's rebind protection off — the
      # edge already terminates TLS and the service only accepts
      # bearer-authenticated MCP requests.
      - key: FITNESS_MCP_HTTP_DISABLE_DNS_REBINDING
        value: "true"

      # Needed only if you'll connect from claude.ai web / iPhone.
      - key: FITNESS_MCP_HTTP_CORS_ORIGINS
        value: "https://claude.ai"
