[project]
name = "fitness-mcp"
version = "0.1.0"
description = "MCP server that lets Claude read your Garmin Connect fitness data (activities, sleep, HRV, VO2 max, body battery, trends)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Harish Singh Bisht", email = "harishsinghbisht8@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "garmin", "fitness", "health", "sleep", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # Needed when FITNESS_MCP_TRANSPORT=http. Already pulled in by mcp[cli] but
    # declared explicitly so the HTTP path is a supported, first-class install.
    "starlette>=0.37",
    "uvicorn>=0.30",
    # Official Garmin Personal API client — owns endpoint strings + response
    # shapes so we don't guess them. See providers/garmin.py.
    "garmin-connect-personal-api-python>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/letsjustrun/fitness-mcp"
Issues = "https://github.com/letsjustrun/fitness-mcp/issues"
Documentation = "https://github.com/letsjustrun/fitness-mcp#readme"
Changelog = "https://github.com/letsjustrun/fitness-mcp/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
fitness-mcp = "fitness_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/fitness_mcp/store/schema.sql" = "fitness_mcp/store/schema.sql"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
